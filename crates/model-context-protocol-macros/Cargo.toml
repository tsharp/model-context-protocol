[package]
name = "model-context-protocol-macros"
version = "0.1.0"
edition = "2021"
authors = ["Travis Sharp <travis@kuipersys.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tsharp/model-context-protocol"
description = "Procedural macros for MCP server and tool definitions"
keywords = ["mcp", "ai", "llm", "tools", "macros"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
darling = "0.20"

[dev-dependencies]
trybuild = "1.0"
