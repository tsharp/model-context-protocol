[package]
name = "macro-calculator"
version = "0.1.0"
edition = "2021"
publish = false
description = "Calculator MCP server example using macros"

[dependencies]
mcp = { path = "../..", package = "model-context-protocol", features = ["macros"] }
mcp-macros = { path = "../../crates/mcp-macros" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
